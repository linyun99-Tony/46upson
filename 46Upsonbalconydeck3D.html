<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>46 Upson balcony deck - 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a site-meeting model, plain and exact
   IDEA: the builder's foam-board mock-up on the plan table
   PICTURE: the balcony itself, orbitable, layers peeled like a section
   COLOUR and TYPE: plan-paper ground, graphite ink, survey-tape orange accent; IBM Plex Sans
   LAYOUT: model fills the screen, a slim control strip and a facts card that collapse on phones */
:root{color-scheme:light dark;--bg:light-dark(#f2efe8,#15181b);--ink:light-dark(#1d2329,#e9e6df);--mute:light-dark(#5d646b,#a2a7ac);--card:light-dark(#fffdf8,#1f2327);--line:light-dark(#d9d3c7,#33393f);--acc:#e8641b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
header{position:fixed;left:16px;top:14px;right:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none}
h1{margin:0;font-size:22px;line-height:1.1;font-weight:600;text-wrap:balance}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.card{pointer-events:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
#facts{width:290px}
#facts dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
#facts dt{color:var(--mute)}#facts dd{margin:0}
#facts summary{cursor:pointer;font-weight:600;list-style:none}
#bar{position:fixed;left:16px;right:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:12px;color:var(--mute);margin-right:2px}
button{font:inherit;font-size:14px;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button[aria-pressed=false]{opacity:.5;text-decoration:line-through}
button.on{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#pick{position:fixed;right:16px;bottom:72px;max-width:320px;font-size:13px;display:none}
#pick b{display:block;font-size:14px}
.key{display:flex;gap:10px;font-size:12px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
@media(max-width:640px){h1{font-size:18px}#facts{width:auto;max-width:56vw}#facts[open] dl{font-size:12px}#bar{bottom:8px}button{font-size:13px;padding:0 9px}}
</style></head><body>
<div id="stage"></div>
<header><div class="card"><h1>2nd-floor balcony floating deck</h1><div class="sub">46 Upson Road, Wellesley, MA 02482 &middot; drag to orbit, scroll to zoom, tap a part for its name</div>
<div class="key"><span><i style="background:#2f6fd6"></i>Handi Block</span><span><i style="background:#e8641b"></i>Low pedestal</span><span><i style="background:#b6a77f"></i>PT 2x6</span></div></div>
<details id="facts" class="card" open><summary>Key numbers</summary><dl id="dl"></dl><div class="sub">Membrane heights are modeled until the field survey.</div></details></header>
<div id="bar">
 <div class="grp card"><span class="lab">Show</span>
  <button data-l="deck" aria-pressed="true">Decking</button><button data-l="rail" aria-pressed="true">Railing</button>
  <button data-l="frame" aria-pressed="true">Framing</button><button data-l="sup" aria-pressed="true">Supports</button>
  <button data-l="house" aria-pressed="true">House</button></div>
 <div class="grp card"><span class="lab">View</span>
  <button data-v="over" class="on">Overview</button><button data-v="door">From door</button>
  <button data-v="frame">Framing</button><button data-v="low">Low edge</button></div>
</div>
<div id="pick" class="card"></div>

const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 400);
const ctl = new THREE.OrbitControls(cam, R.domElement); ctl.enableDamping = true;
S.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-14, 30, 10); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, {left: -20, right: 20, top: 20, bottom: -20}); S.add(sun);
const cx = D.X1 / 2, cy = D.Y1 / 2;
const V = (x, y, z) => new THREE.Vector3((x - cx) / 12, z / 12, -(y - cy) / 12);
const G = {}; for (const k of ['house', 'memb', 'sup', 'frame', 'deck', 'rail']) { G[k] = new THREE.Group(); S.add(G[k]); }
const M = c => new THREE.MeshStandardMaterial({color: c, roughness: .85, metalness: 0});
const mat = {wall: M(0xe9e6df), door: M(0x4b5966), memb: M(0x2c2f33), roof: M(0x45484d), pad: M(0x3a3d41),
  hb: M(0x2f6fd6), low: M(0xe8641b), shim: M(0x7d7a73), pt: M(0xb6a77f), rim: M(0xa8986c),
  deck: M(new THREE.Color(...D.board_rgb).getHex()), rail: new THREE.MeshStandardMaterial({color: 0x1b1c1e, roughness: .45, metalness: .3})};
const box = (x0, x1, y0, y1, z0, z1, m, g, name) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(x1 - x0) / 12, Math.abs(z1 - z0) / 12, Math.abs(y1 - y0) / 12), m);
  b.position.copy(V((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)); b.castShadow = b.receiveShadow = true;
  b.userData.name = name; g.add(b); return b; };
const cyl = (x, y, z0, h, rad, m, g, name) => {
  const c = new THREE.Mesh(new THREE.CylinderGeometry(rad / 12, rad / 12, h / 12, 28), m);
  c.position.copy(V(x, y, z0 + h / 2)); c.castShadow = c.receiveShadow = true; c.userData.name = name; g.add(c); return c; };
// membrane surface from the modeled grid
const zg = (x, y) => { const i = Math.min(D.gx - 2, Math.max(0, Math.floor(x / D.X1 * (D.gx - 1)))), j = Math.min(D.gy - 2, Math.max(0, Math.floor(y / D.Y1 * (D.gy - 1))));
  const fx = x / D.X1 * (D.gx - 1) - i, fy = y / D.Y1 * (D.gy - 1) - j, g = D.grid;
  return (g[j][i] * (1 - fx) + g[j][i + 1] * fx) * (1 - fy) + (g[j + 1][i] * (1 - fx) + g[j + 1][i + 1] * fx) * fy; };
{ const pos = [], idx = []; const nx = D.gx, ny = D.gy;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { const x = D.X1 * i / (nx - 1), y = D.Y1 * j / (ny - 1); const v = V(x, y, D.grid[j][i]); pos.push(v.x, v.y, v.z); }
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const x = D.X1 * (i + .5) / (nx - 1), y = D.Y1 * (j + .5) / (ny - 1); if (x < D.NX && y < D.NY) continue;
    const a = j * nx + i; idx.push(a, a + nx, a + 1, a + 1, a + nx, a + nx + 1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0x2c2f33, roughness: .9, side: THREE.DoubleSide})); m.receiveShadow = true; m.userData.name = 'EPDM on tapered polyiso (modeled slope)'; G.memb.add(m); }
// roof skirt (3/12) on the open edges
{ const zE = zg(D.X1 / 2, D.Y1 - .1), sk = 24, dz = -6;
  const quad = (a, b, c, d, name) => { const g = new THREE.BufferGeometry(); const p = [a, b, c, a, c, d].flatMap(q => { const v = V(...q); return [v.x, v.y, v.z]; });
    g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color: 0x45484d, side: THREE.DoubleSide, roughness: .95})); m.userData.name = name; G.house.add(m); };
  quad([0, D.Y1, zE], [D.X1, D.Y1, zE], [D.X1 + sk, D.Y1 + sk, zE + dz], [-sk, D.Y1 + sk, zE + dz], 'Existing 3/12 roof skirt (north)');
  quad([D.X1, 0, zE], [D.X1, D.Y1, zE], [D.X1 + sk, D.Y1 + sk, zE + dz], [D.X1 + sk, -7, zE + dz], 'Existing 3/12 roof skirt (east)');
  quad([0, D.NY, zE], [0, D.Y1, zE], [-sk, D.Y1 + sk, zE + dz], [-sk, D.NY, zE + dz], 'Existing 3/12 roof skirt (west)'); }
// house walls with door 2-08
{ const zb = -20, zt = 96, w = 'Existing exterior wall';
  box(D.NX, D.door[0], -7, 0, zb, zt, mat.wall, G.house, w); box(D.door[1], D.X1 + 7, -7, 0, zb, zt, mat.wall, G.house, w);
  box(D.door[0], D.door[1], -7, 0, 84, zt, mat.wall, G.house, w);
  box(D.door[0] + 2, D.door[1] - 2, -3.5, -2.5, 0, 82, mat.door, G.house, 'Door 2-08 (threshold = 0)');
  box(D.door[0], D.door[1], -7, 0, -1, 0, mat.rail, G.house, 'Door threshold');
  box(0, D.NX, 0, D.NY, zb, zt, mat.wall, G.house, 'Laundry wall'); box(-40, D.NX, D.NY - 7, D.NY, zb, zt, mat.wall, G.house, 'Laundry wall'); }
// supports
for (const [x, y, z, t, n, sh, id] of D.sups) {
  box(x - 6, x + 6, y - 6, y + 6, z, z + D.pad, mat.pad, G.sup, `#${id} protection pad`);
  let top = z + D.pad, label;
  if (t === 'HB') { for (let k = 0; k < n; k++) cyl(x, y, top + k * 1.75, 1.75, 5, mat.hb, G.sup, `#${id} Handi Block`); top += 1.75 * n; label = 'Handi Block'; }
  else { cyl(x, y, top, .7, 3.2, mat.low, G.sup, `#${id} BGTLGIO low pedestal`); top += .7; label = 'low pedestal'; }
  if (sh > .05) box(x - 2.5, x + 2.5, y - 2, y + 2, top, top + sh, mat.shim, G.sup, `#${id} shim ${(sh).toFixed(2)} in. over ${label}`); }
// framing
for (const [name, kind, x0, x1, y0, y1] of D.members) box(x0, x1, y0, y1, D.jb, D.jb + D.jd, kind === 'joist' ? mat.pt : mat.rim, G.frame, `${name} - 2x6 PT on edge`);
// decking + fascia
for (const [x0, x1, y0, y1, e] of D.courses) box(x0, x1, y0, y1, D.dtop - D.bt, D.dtop, mat.deck, G.deck, e === 'SQUARE' ? 'Square-edge nosing board (Cortex)' : 'Composite deck board, hidden clips');
{ const f = D.frame, t = .56, z1 = D.dtop - D.bt, z0 = z1 - D.fascia_h;
  box(f.fx0 - t, f.fx1 + t, f.fy1, f.fy1 + t, z0, z1, mat.deck, G.deck, 'Fascia (north)');
  box(f.fx1, f.fx1 + t, f.fy0, f.fy1, z0, z1, mat.deck, G.deck, 'Fascia (east)'); box(f.fx0 - t, f.fx0, f.ny0, f.fy1, z0, z1, mat.deck, G.deck, 'Fascia (west)'); }
// railing
{ const P = D.posts, top = D.dtop + D.guard;
  for (const [x, y] of P) { box(x - 1.25, x + 1.25, y - 1.25, y + 1.25, D.dtop, top, mat.rail, G.rail, 'Aluminum post on solid blocking (Det. 2)');
    box(x - 2.35, x + 2.35, y - 2.35, y + 2.35, D.dtop, D.dtop + .4, mat.rail, G.rail, 'Post base plate'); }
  const same = (a, b) => Math.abs(a - b) < .5;
  const runs = [P.filter(q => same(q[1], P[0][1])).sort((a, b) => a[0] - b[0]),
    P.filter(q => same(q[0], Math.max(...P.map(p => p[0])))).sort((a, b) => a[1] - b[1]),
    P.filter(q => same(q[0], Math.min(...P.map(p => p[0])))).sort((a, b) => a[1] - b[1])];
  for (const run of runs) for (let i = 0; i < run.length - 1; i++) {
    const [ax, ay] = run[i], [bx, by] = run[i + 1], L = Math.hypot(bx - ax, by - ay), ux = (bx - ax) / L, uy = (by - ay) / L;
    for (const z of [top - 1.5, D.dtop + 3]) box(Math.min(ax, bx) - (uy ? .6 : 0), Math.max(ax, bx) + (uy ? .6 : 0), Math.min(ay, by) - (ux ? .6 : 0), Math.max(ay, by) + (ux ? .6 : 0), z, z + 1.5, mat.rail, G.rail, 'Rail');
    const n = Math.floor((L - 2.5) / 4.4);
    for (let k = 1; k <= n; k++) { const x = ax + ux * (1.25 + k * (L - 2.5) / (n + 1)), y = ay + uy * (1.25 + k * (L - 2.5) / (n + 1));
      box(x - .375, x + .375, y - .375, y + .375, D.dtop + 4.5, top - 1.5, mat.rail, G.rail, 'Baluster (< 4 in. clear)'); } } }
// views
const dx = (D.door[0] + D.door[1]) / 24 - cx / 12;
const views = {over: [[13, 15, -22], [0, -0.5, 0]], door: [[dx, 5.3, cy / 12 - 0.6], [dx + 2, 1.2, -6]],
  frame: [[9, 13, -17], [0, -0.6, 0]], low: [[-9, 0.8, -cy / 12 - 9], [0, -0.4, 0]]};
const go = k => { const [p, t] = views[k]; cam.position.set(...p); ctl.target.set(...t); ctl.update();
  document.querySelectorAll('[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === k));
  if (k === 'frame') setLayer('deck', false), setLayer('rail', false); else setLayer('deck', true), setLayer('rail', true); };
const setLayer = (k, on) => { G[k].visible = on; const b = document.querySelector(`[data-l="${k}"]`); if (b) b.setAttribute('aria-pressed', on); };
document.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => setLayer(b.dataset.l, !G[b.dataset.l].visible)));
document.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => go(b.dataset.v)));
// pick
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), pick = document.getElementById('pick'); let down = null;
R.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
R.domElement.addEventListener('pointerup', e => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = R.domElement.getBoundingClientRect(); ptr.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ptr, cam); const hit = ray.intersectObjects(Object.values(G).filter(g => g.visible), true)[0];
  if (hit) { const p = hit.point; pick.style.display = 'block';
    pick.innerHTML = `<b>${hit.object.userData.name || ''}</b>${(p.y * 12).toFixed(1)} in. relative to the door threshold`; } else pick.style.display = 'none'; });
const size = () => { const w = stage.clientWidth, h = stage.clientHeight; R.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); };
const ro = new ResizeObserver(size); ro.observe(stage); size(); go('over');
const loop = () => { ctl.update(); R.render(S, cam); requestAnimationFrame(loop); }; loop();
}
